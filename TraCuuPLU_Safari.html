function normalize(s) {
  return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
const indexed = products.map(p => ({
  name:p["Tên sản phẩm"], plu:String(p["Mã PLU"]), normName:normalize(p["Tên sản phẩm"])
}));

function render(list) {
  const box=document.getElementById('result');
  const count=document.getElementById('count');
  count.textContent = list.length.toLocaleString('vi-VN') + ' sản phẩm';
  if (!list.length) {
    box.innerHTML='<div class="empty">Không tìm thấy sản phẩm phù hợp.</div>';
    return;
  }
  box.innerHTML=list.slice(0,50).map(p =>
    '<div class="row"><div class="name">'+escapeHtml(p.name)+'</div><div class="plu">'+escapeHtml(p.plu)+'</div></div>'
  ).join('');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function search() {
  const q=document.getElementById('searchInput').value;
  const n=normalize(q);
  if (!n) { render(indexed); return; }
  render(indexed.filter(p => p.normName.includes(n) || p.plu.includes(n)));
}
document.getElementById('searchInput').addEventListener('input', search);
document.getElementById('clearBtn').addEventListener('click', () => {
  const input=document.getElementById('searchInput'); input.value=''; input.focus(); search();
});
render(indexed);
</script>
